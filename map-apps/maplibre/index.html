<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Basic MapLibre GL JS map with sample stations." />
    <title>MapLibre GL JS · Mapping apps</title>
  </head>
  <body class="map-app">
    <header class="toolbar">
      <a href="../">All apps</a>
      <h1>MapLibre GL JS</h1>
      <label><input id="stations" type="checkbox" checked disabled /> Sample stations</label>
      <button id="reset" type="button" disabled>Reset view</button>
    </header>
    <main class="map-frame">
      <div id="map" role="region" aria-label="MapLibre map" tabindex="0"></div>
    </main>
    <p id="status" class="status" role="status">Loading map…</p>
    <noscript>This app requires JavaScript.</noscript>
    <script type="module" src="./main.js"></script>
  </body>
</html>
